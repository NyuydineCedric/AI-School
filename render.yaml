# IMPORTANT: Render's default web service filesystem is EPHEMERAL — it resets
# on every deploy and every time the service spins down/restarts. This app
# uses a SQLite file (school.db) for storage, so without a persistent disk
# attached, all data (users, courses, assignments, everything) is wiped on
# every redeploy. Either:
#   1. Uncomment the `disk:` block below (requires a paid Render plan), or
#   2. Move to a managed Postgres database before relying on this in real use.
services:
  - type: web
    name: smart-school-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # disk:
    #   name: school-db
    #   mountPath: /opt/render/project/src/backend
    #   sizeGB: 1
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
